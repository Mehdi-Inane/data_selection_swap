# Fine-tuning an ImageNet-pretrained ResNet-18 on small subsets of CIFAR-100:
# fine-tune the pretrained model on the full pool for 10 epochs, select with
# its epoch-1 checkpoint, then fine-tune that same epoch-1 checkpoint on each
# subset for 10 epochs, so training starts where the gradients were matched.
# Trains its own seed-42 reference: run the reference stage first. Every
# subset fine-tune starts from its checkpoint_001.pth, which only exists once
# the reference's first epoch has finished. (--save_initial_checkpoint is
# kept so the configuration matches the reference already trained with it.)
schema_version: 1
name: cifar100_finetune
description: >
  CIFAR-100 (ImageNet normalisation, upsampled to 224 px inside the network)
  with torchvision's ImageNet-1k ResNet-18 and a new 100-class head, at 1%,
  2%, 5% and 10% of the pool (5 to 50 images per class), seed 42.
  Reference: full-data fine-tune, 10 epochs, SGD, lr 0.01 cosine, batch
  128, with the starting weights saved as epoch 0. Every selector reads the
  reference's epoch-1 checkpoint: Random, stratified random and GraphCut
  against Algorithm 1 and the second-order swap (k = 16, cached count sketch
  p = 1024), plain and class-balanced. Each subset is fine-tuned from the
  reference's epoch-1 checkpoint for 10 epochs over the subset (SGD, lr
  0.01 cosine, batch 128).
status: ready

constants:
  reference_dir: "{results}/data_selection_swap/{dataset}/{architecture}/checkpoints/seed_42"
  data_dir: "{data_root}/cifar100_data"

stages:
  reference:
    script: scripts/train/full_data.py
    grid:
      dataset: [cifar100_in1k]
      architecture: [resnet18_in1k]
      seed: [42]
    args:
      data_dir: "{data_dir}"
      save_dir: "{reference_dir}"
      save_initial_checkpoint: true
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  single_swap:
    # Algorithm 1 on exact full-network gradients. The most expensive stage
    # (each sweep passes over the pool at 224 px).
    script: scripts/select/kl_full.py
    grid:
      dataset: [cifar100_in1k]
      architecture: [resnet18_in1k]
      fraction: [0.01, 0.02, 0.05, 0.1]
      seed: [42]
    args:
      swaps_per_sweep: 1
      candidates: 1
      refresh_every: 0
      max_iters: 200
      proj_dim: 0
      checkpoint_epochs: [1]
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_dir}"
      init_ckpt: "{reference_dir}/checkpoint_001.pth"
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order:
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [16]
      dataset: [cifar100_in1k]
      architecture: [resnet18_in1k]
      fraction: [0.01, 0.02, 0.05, 0.1]
      seed: [42]
    args:
      swap_rule: second_order
      accept_tol: 1.0e-12
      max_iters: 1500
      proj_dim: 1024
      per_sample_batch_size: 64
      checkpoint_epochs: [1]
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_dir}"
      init_ckpt: "{reference_dir}/checkpoint_001.pth"
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order_class_balanced:
    # Per-class quotas: starts from the stratified-random subset of the same
    # seed (baselines: random_stratified) and swaps within classes, so the
    # two differ only by the gradient matching.
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [16]
      dataset: [cifar100_in1k]
      architecture: [resnet18_in1k]
      fraction: [0.01, 0.02, 0.05, 0.1]
      seed: [42]
    args:
      swap_rule: second_order
      class_balanced: true
      class_shortlist_k: 16
      accept_tol: 1.0e-12
      max_iters: 1500
      proj_dim: 1024
      per_sample_batch_size: 64
      checkpoint_epochs: [1]
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_dir}"
      init_ckpt: "{reference_dir}/checkpoint_001.pth"
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  baselines:
    grid:
      dataset: [cifar100_in1k]
      architecture: [resnet18_in1k]
      method: [random, random_stratified, graphcut, herding]
      fraction: [0.01, 0.02, 0.05, 0.1]
      seed: [42]
    choices:
      method:
        random: {script: scripts/select/random_selection.py}
        random_stratified:
          script: scripts/select/random_selection.py
          args: {stratified: true}
        graphcut:
          script: scripts/select/submodular.py
          # Embed with the epoch-1 checkpoint, the one the swap selectors use.
          args: {function: graphcut, kernel: features,
                 embedding_checkpoint: "{reference_dir}/checkpoint_001.pth"}
        herding:
          script: scripts/select/herding.py
          # Per-class feature-mean matching, on the same epoch-1 embedding.
          args: {kernel: features,
                 embedding_checkpoint: "{reference_dir}/checkpoint_001.pth"}
    args:
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_dir}"
      init_ckpt: "{reference_dir}/checkpoint_001.pth"
      scoring_transform: test
      retrain_optimizer: sgd
      lr: 0.01
      weight_decay: 0.0005
      batch_size: 128
      num_workers: 4
      download: true
