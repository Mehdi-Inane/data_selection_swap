# CIFAR-10-LT: Random and the single-swap Algorithm 1 against versions of the
# second-order swap. The long-tailed pool needs its own reference
# trajectories (seed 42, shared by every run): run the reference stage first.
schema_version: 1
name: cifar10_lt_second_order
description: >
  CIFAR-10-LT (imbalance ratio 50, common.LONG_TAIL_RATIO: class c keeps
  5000 * 50^(-c/9) images, 13,996 in all, one fixed draw for every run;
  balanced test set; one seed-42 reference trajectory) with ResNet-18 and
  VGG-16 at 5%, 10%, 25% and 50% of the pool, seeds 42, 562 and 777. Random
  and Algorithm 1 (single swap, exact gradients, the paper's 200 sweeps)
  against the second-order k x k swap on the epoch-1 checkpoint: shortlist k
  = 8, 16 and 32 and the class-balanced version (k = 32, k_c = 16; its
  quotas follow the long-tailed class counts) on the cached count sketch (p
  = 1024), and the exact R^d version (k = 32). Every subset is retrained for
  300 epochs (SGD, lr 0.01, batch 128) from the initialisation shared by all
  methods.
status: ready

constants:
  # One reference trajectory, seed 42, shared by every run (Appendix G.1).
  reference_dir: "{results}/data_selection_swap/{dataset}/{architecture}/checkpoints/seed_42"
  init_ckpt: "{results}/data_selection_swap/init/{dataset}_{architecture}_seed{seed}.pth"

stages:
  reference:
    script: scripts/train/full_data.py
    grid:
      dataset: [cifar10_lt]
      architecture: [resnet18, vgg16]
      seed: [42]
    args:
      data_dir: "{data_root}/{dataset}_data"
      save_dir: "{reference_dir}"
      lr: 0.01
      num_epochs: 300
      batch_size: 128
      num_workers: 4
      download: true

  single_swap:
    script: scripts/select/kl_full.py
    grid:
      dataset: [cifar10_lt]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42, 562, 777]
    args:
      swaps_per_sweep: 1
      candidates: 1
      refresh_every: 0
      max_iters: 200
      proj_dim: 0
      checkpoint_dir: "{reference_dir}"
      allow_manifest_mismatch: true      # seeds 562 and 777 read seed 42's trajectory
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order:
    script: scripts/select/kl_full.py
    grid:
      variant: [k8, k16, k32, k32_class_balanced]
      dataset: [cifar10_lt]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42, 562, 777]
    choices:
      variant:
        k8: {args: {shortlist_k: 8}}
        k16: {args: {shortlist_k: 16}}
        k32: {args: {shortlist_k: 32}}
        k32_class_balanced: {args: {shortlist_k: 32, class_balanced: true,
                                    class_shortlist_k: 16}}
    args: &second_order
      swap_rule: second_order
      accept_tol: 1.0e-12
      max_iters: 1500
      checkpoint_dir: "{reference_dir}"
      allow_manifest_mismatch: true      # seeds 562 and 777 read seed 42's trajectory
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_dim: 1024
      proj_seed: 0
      score_batch_size: 128
      per_sample_batch_size: 64
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order_exact:
    # One JVP sweep over the pool per swap: hours per run, unlike the cache.
    script: scripts/select/kl_full.py
    grid:
      dataset: [cifar10_lt]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42, 562, 777]
    args:
      <<: *second_order
      shortlist_k: 32
      proj_dim: 0

  random:
    script: scripts/select/random_selection.py
    grid:
      dataset: [cifar10_lt]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42, 562, 777]
    args:
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      scoring_transform: test
      retrain_optimizer: sgd
      lr: 0.01
      weight_decay: 0.0005
      batch_size: 128
      num_workers: 4
      download: true
