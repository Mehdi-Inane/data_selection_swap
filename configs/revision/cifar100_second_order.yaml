# CIFAR-100: Random, GraphCut and the single-swap Algorithm 1 against the
# second-order swap; the same methods as cifar10_lt_second_order.yaml.
# Trains its own seed-42 reference models: run the reference stage first.
schema_version: 1
name: cifar100_second_order
description: >
  CIFAR-100 with ResNet-18 and VGG-16 at 5%, 10%, 25% and 50% of the pool,
  seed 42. Random, GraphCut and Algorithm 1 (single swap, exact gradients,
  the paper's 200 sweeps) against the second-order k x k swap with shortlist
  k = 8 and k = 16 (cached count sketch, p = 1024), and its
  class-balanced version (k_c = 16 per class). GraphCut and both swap
  methods read only the epoch-1 checkpoint of the seed-42 reference model.
  Every subset is retrained for 300 epochs (SGD, lr 0.01, batch 128) from
  the initialisation shared by all methods.
status: ready

constants:
  reference_dir: "{results}/data_selection_swap/{dataset}/{architecture}/checkpoints/seed_42"
  init_ckpt: "{results}/data_selection_swap/init/{dataset}_{architecture}_seed{seed}.pth"

stages:
  reference:
    script: scripts/train/full_data.py
    grid:
      dataset: [cifar100]
      architecture: [resnet18, vgg16]
      seed: [42]
    args:
      data_dir: "{data_root}/{dataset}_data"
      save_dir: "{reference_dir}"
      lr: 0.01
      num_epochs: 300
      batch_size: 128
      num_workers: 4
      download: true

  single_swap:
    script: scripts/select/kl_full.py
    grid:
      dataset: [cifar100]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42]
    args:
      swaps_per_sweep: 1
      candidates: 1
      refresh_every: 0
      max_iters: 200
      proj_dim: 0
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order:
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [8, 16]
      dataset: [cifar100]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42]
    args:
      swap_rule: second_order
      accept_tol: 1.0e-12
      max_iters: 1500
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_dim: 1024
      proj_seed: 0
      score_batch_size: 128
      per_sample_batch_size: 64
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order_class_balanced:
    # The second-order swap with per-class quotas: the start is a draw
    # stratified at common.per_class_budget (proportional to the pool's class
    # counts) and every exchange stays inside one class, with a shortlist of
    # class_shortlist_k drops and adds per class.
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [16]
      dataset: [cifar100]
      architecture: [resnet18, vgg16]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42]
    args:
      swap_rule: second_order
      class_balanced: true
      class_shortlist_k: 16
      accept_tol: 1.0e-12
      max_iters: 1500
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_dim: 1024
      proj_seed: 0
      score_batch_size: 128
      per_sample_batch_size: 64
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  baselines:
    grid:
      dataset: [cifar100]
      architecture: [resnet18, vgg16]
      method: [random, graphcut]
      fraction: [0.05, 0.1, 0.25, 0.5]
      seed: [42]
    choices:
      method:
        random: {script: scripts/select/random_selection.py}
        graphcut:
          script: scripts/select/submodular.py
          # Embed with the epoch-1 checkpoint, the one the swap selectors use.
          args: {function: graphcut, kernel: features,
                 embedding_checkpoint: "{reference_dir}/checkpoint_001.pth"}
    args:
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      scoring_transform: test
      retrain_optimizer: sgd
      lr: 0.01
      weight_decay: 0.0005
      batch_size: 128
      num_workers: 4
      download: true
