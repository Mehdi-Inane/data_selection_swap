# Contamination pilot: does the swap drop mislabelled examples? Trains its
# own seed-42 reference on the noisy pool.
schema_version: 1
name: cifar10_noisy_pilot
description: >
  CIFAR-10 with 20% symmetric label noise (common.LABEL_NOISE; one fixed
  draw; clean test set), ResNet-18, 10% of the pool, seed 42. Random,
  GraphCut (epoch-1 features), Algorithm 1 (single swap, exact gradients) and
  the second-order swap (k = 8, 16, and class-balanced k_c = 16, cached count
  sketch p = 1024), all on the epoch-1 checkpoint of a reference trained on
  the noisy pool. The share of mislabelled examples each subset keeps is
  counted from cfg['corrupt_indices'].
status: ready

constants:
  reference_dir: "{results}/data_selection_swap/{dataset}/{architecture}/checkpoints/seed_42"
  init_ckpt: "{results}/data_selection_swap/init/{dataset}_{architecture}_seed{seed}.pth"

stages:
  reference:
    script: scripts/train/full_data.py
    grid:
      dataset: [cifar10_noisy20]
      architecture: [resnet18]
      seed: [42]
    args:
      data_dir: "{data_root}/{dataset}_data"
      save_dir: "{reference_dir}"
      lr: 0.01
      num_epochs: 300
      batch_size: 128
      num_workers: 4
      download: true

  single_swap:
    script: scripts/select/kl_full.py
    grid:
      dataset: [cifar10_noisy20]
      architecture: [resnet18]
      fraction: [0.1]
      seed: [42]
    args:
      swaps_per_sweep: 1
      candidates: 1
      refresh_every: 0
      max_iters: 200
      proj_dim: 0
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order:
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [8, 16]
      dataset: [cifar10_noisy20]
      architecture: [resnet18]
      fraction: [0.1]
      seed: [42]
    args:
      swap_rule: second_order
      accept_tol: 1.0e-12
      max_iters: 1500
      proj_dim: 1024
      per_sample_batch_size: 64
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  second_order_class_balanced:
    script: scripts/select/kl_full.py
    grid:
      shortlist_k: [16]
      dataset: [cifar10_noisy20]
      architecture: [resnet18]
      fraction: [0.1]
      seed: [42]
    args:
      swap_rule: second_order
      class_balanced: true
      class_shortlist_k: 16
      accept_tol: 1.0e-12
      max_iters: 1500
      proj_dim: 1024
      per_sample_batch_size: 64
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_seed: 0
      score_batch_size: 128
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  baselines:
    grid:
      dataset: [cifar10_noisy20]
      architecture: [resnet18]
      method: [random, graphcut]
      fraction: [0.1]
      seed: [42]
    choices:
      method:
        random: {script: scripts/select/random_selection.py}
        graphcut:
          script: scripts/select/submodular.py
          # Embed with the epoch-1 checkpoint, the one the swap selectors use.
          args: {function: graphcut, kernel: features,
                 embedding_checkpoint: "{reference_dir}/checkpoint_001.pth"}
    args:
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      scoring_transform: test
      retrain_optimizer: sgd
      lr: 0.01
      weight_decay: 0.0005
      batch_size: 128
      num_workers: 4
      download: true
