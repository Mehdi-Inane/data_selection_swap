# Implementation guide, Exp B.
schema_version: 1
name: exp_b_contamination
description: >
  10% or 5% of the CIFAR-10/100 training pool get a random wrong label plus
  a strong input corruption: additive Gaussian noise (sigma = 1.5 in
  normalised pixel space) or replacement by an SVHN image. The test set stays
  clean. Each contaminated pool gets its own seed-42 reference trajectory.
  Gradient Swap (Algorithm 1 and the second-order swap, cached sketch
  p = 1024, epoch-1 checkpoint) and the seven baselines select 5% and 10%,
  five seeds, all three architectures; every selector records how many
  contaminated examples it kept.
status: planned
requires: >
  Phase 2: contaminated pools behind the --contamination,
  --contamination_rate, --contamination_std, --svhn_dir and --pool_seed
  options of every script below; a result layout that keeps contaminated
  runs apart from clean ones; pool_corrupt_fraction, selected_corrupt_count
  and selected_corrupt_fraction in every timing record.

constants:
  reference_dir: "{results}/data_selection_swap/{dataset}_{corruption}_{contamination_rate}/{architecture}/checkpoints/seed_42"
  init_ckpt: "{results}/data_selection_swap/init/{dataset}_{architecture}_seed{seed}.pth"

stages:
  reference:
    script: scripts/train/full_data.py
    grid:
      dataset: [cifar10, cifar100]
      corruption: [gaussian, svhn]
      contamination_rate: [0.1, 0.05]
      architecture: [resnet18, vgg16, inception]
      seed: [42]
    choices: &corruptions
      corruption:
        gaussian: {args: {contamination: gaussian, contamination_std: 1.5}}
        svhn: {args: {contamination: svhn, svhn_dir: "{data_root}/svhn_data"}}
    args:
      pool_seed: 0
      data_dir: "{data_root}/{dataset}_data"
      save_dir: "{reference_dir}"
      lr: 0.01
      num_epochs: 300
      batch_size: 128
      num_workers: 4
      download: true

  gradient_swap:
    script: scripts/select/kl_full.py
    grid:
      variant: [algorithm1, second_order]
      dataset: [cifar10, cifar100]
      corruption: [gaussian, svhn]
      contamination_rate: [0.1, 0.05]
      architecture: [resnet18, vgg16, inception]
      fraction: [0.05, 0.1]
      seed: [42, 43, 44, 45, 46]
    choices:
      <<: *corruptions
      variant:
        algorithm1:
          args: {swap_rule: ranked, sketch_cache: true, swaps_per_sweep: 1, candidates: 1,
                 max_iters: 200}
        second_order:
          args: {swap_rule: second_order, shortlist_k: 32, accept_tol: 1.0e-12,
                 max_iters: 1500}
    args:
      pool_seed: 0
      checkpoint_dir: "{reference_dir}"
      allow_manifest_mismatch: true
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      num_checkpoints: 1
      checkpoint_selection: spread
      checkpoint_weighting: point
      optimizer: sgd
      metric: auto
      scoring_transform: test
      proj_dim: 1024
      proj_seed: 0
      score_batch_size: 128
      per_sample_batch_size: 64
      retrain_optimizer: sgd
      lr: 0.01
      batch_size: 128
      num_workers: 4
      download: true

  baselines:
    grid:
      dataset: [cifar10, cifar100]
      corruption: [gaussian, svhn]
      contamination_rate: [0.1, 0.05]
      architecture: [resnet18, vgg16, inception]
      method: [random, herding, moderate, el2n, moso, graphcut, facility_location]
      fraction: [0.05, 0.1]
      seed: [42, 43, 44, 45, 46]
    choices:
      <<: *corruptions
      method:
        random: {script: scripts/select/random_selection.py}
        herding: {script: scripts/select/herding.py, args: {kernel: features}}
        moderate: {script: scripts/select/moderate.py}
        el2n:
          script: scripts/select/el2n.py
          args: {source: probes, num_probes: 10, score_epoch: 20}
        moso:
          script: scripts/select/moso.py
          args: {source: surrogates, grad_space: full, num_trials: 8, surrogate_epochs: 50,
                 samples: 10}
        graphcut:
          script: scripts/select/submodular.py
          args: {function: graphcut, kernel: features}
        facility_location:
          script: scripts/select/submodular.py
          args: {function: facility_location, kernel: features}
    args:
      pool_seed: 0
      checkpoint_dir: "{reference_dir}"
      data_dir: "{data_root}/{dataset}_data"
      init_ckpt: "{init_ckpt}"
      scoring_transform: test
      retrain_optimizer: sgd
      lr: 0.01
      weight_decay: 0.0005
      batch_size: 128
      num_workers: 4
      download: true
